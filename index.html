<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกค่าน้ำมันรายวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0ee; --card:#ffffff; --ink:#14302b; --muted:#5d7570; --line:#d3dcd9;
    --pump:#14302b; --digit:#ffb703; --danger:#b3261e; --ok:#1d6b4f;
    --font:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1b19; --card:#172826; --ink:#e6efec; --muted:#93aaa4; --line:#2b403c;
      --pump:#0a1312; --digit:#ffb703; --danger:#ff8a80; --ok:#6fd3a8; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;
    padding:max(16px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
  main{max-width:560px;margin:0 auto;display:grid;gap:16px}
  h1{font-size:1.25rem;margin:4px 0 0;font-weight:600}

  .pump{background:var(--pump);border-radius:14px;padding:18px 20px;color:#cfe0db;
    border:2px solid #0a1312;box-shadow:inset 0 0 0 1px #2c4a44}
  .pump .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .pump small{display:block;font-size:.85rem;color:#9fb8b2}
  .pump .big{font-size:2.6rem;font-weight:700;color:var(--digit);font-variant-numeric:tabular-nums;line-height:1.1}
  .pump .mid{font-size:1.4rem;font-weight:600;color:var(--digit);font-variant-numeric:tabular-nums;text-align:right}
  .pump .unit{font-size:1rem;margin-left:4px;color:#cfe0db;font-weight:500}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:1rem;margin:0 0 12px;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .full{grid-column:1/-1}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
  input{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
  input:focus-visible,button:focus-visible{outline:3px solid var(--digit);outline-offset:1px}
  .preview{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);
    display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .preview b{font-size:1.4rem;font-variant-numeric:tabular-nums}
  .preview span{color:var(--muted);font-size:.9rem}
  button{font:inherit;cursor:pointer;min-height:44px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--ink);padding:8px 14px}
  button.primary{width:100%;margin-top:12px;background:var(--pump);color:var(--digit);
    border-color:var(--pump);font-weight:600;font-size:1.05rem}
  @media (prefers-color-scheme: dark){ button.primary{border-color:var(--digit)} }
  .err{color:var(--danger);font-size:.9rem;min-height:1.2em;margin:8px 0 0}

  .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
  .head h2{margin:0}
  .day{border-top:1px solid var(--line);padding:12px 0}
  .day:first-of-type{border-top:0}
  .day-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .day-top .d{font-weight:600}
  .day-top .t{font-weight:700;font-variant-numeric:tabular-nums}
  .trip{display:flex;justify-content:space-between;align-items:center;gap:8px;
    color:var(--muted);font-size:.9rem;padding:6px 0 0 12px}
  .trip .c{font-variant-numeric:tabular-nums;white-space:nowrap}
  .trip .del{min-height:32px;padding:0 10px;font-size:.85rem;color:var(--danger)}
  .empty{color:var(--muted);text-align:center;padding:16px 0}
  .foot{color:var(--muted);font-size:.8rem;text-align:center}
  summary{cursor:pointer;font-weight:600;min-height:32px}
  .status{color:var(--muted);font-size:.85rem;margin:10px 0 0;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <h1>บันทึกค่าน้ำมันรายวัน</h1>

  <section class="pump" aria-live="polite">
    <div class="row">
      <div>
        <small>วันนี้</small>
        <div class="big"><span id="today">0.00</span><span class="unit">บาท</span></div>
      </div>
      <div>
        <small style="text-align:right">เดือนนี้</small>
        <div class="mid"><span id="month">0.00</span><span class="unit">บาท</span></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>เพิ่มการเดินทาง</h2>
    <div class="grid">
      <div class="full">
        <label for="date">วันที่</label>
        <input id="date" type="date">
      </div>
      <div class="full">
        <label for="km">ระยะทาง (กิโลเมตร)</label>
        <input id="km" type="number" inputmode="decimal" min="0" step="0.1" placeholder="เช่น 24">
      </div>
      <div>
        <label for="kmpl">อัตราสิ้นเปลือง (กม./ลิตร)</label>
        <input id="kmpl" type="number" inputmode="decimal" min="0.1" step="0.1">
      </div>
      <div>
        <label for="price">ราคาน้ำมัน (บาท/ลิตร)</label>
        <input id="price" type="number" inputmode="decimal" min="0" step="0.01">
      </div>
      <div class="full">
        <label for="note">หมายเหตุ (ไม่บังคับ)</label>
        <input id="note" type="text" maxlength="60" placeholder="เช่น บ้าน → โรงเรียน">
      </div>
    </div>
    <div class="preview">
      <span id="liters">0.00 ลิตร</span>
      <b><span id="cost">0.00</span> บาท</b>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="primary" id="save" type="button">บันทึกค่าน้ำมัน</button>
  </section>

  <section class="card">
    <div class="head">
      <h2>ประวัติรายวัน</h2>
      <button id="csv" type="button">ดาวน์โหลด CSV</button>
    </div>
    <div id="log"></div>
  </section>

  <section class="card">
    <details id="sheetBox">
      <summary>เชื่อม Google Sheet</summary>
      <div class="grid" style="margin-top:12px">
        <div class="full">
          <label for="sheetUrl">Web App URL</label>
          <input id="sheetUrl" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <div class="full">
          <label for="sheetToken">รหัส (ต้องตรงกับ TOKEN ในสคริปต์)</label>
          <input id="sheetToken" type="text" autocomplete="off">
        </div>
      </div>
      <button class="primary" id="sheetSave" type="button">บันทึกและซิงก์</button>
    </details>
    <p class="status" id="sheetStatus" role="status"></p>
  </section>

  <p class="foot">ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้ และซิงก์ไป Google Sheet เมื่อเชื่อมไว้</p>
</main>

<script>
(function(){
  var KEY = "fuel-tracker-v1";
  var state = { settings:{ kmpl:15, price:40 }, trips:[], sheet:{ url:"", token:"" }, pending:[] };
  var $ = function(id){ return document.getElementById(id); };

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var d = JSON.parse(raw);
        if(d && d.settings && Array.isArray(d.trips)) state = d;
      }
    }catch(e){}
    state.sheet = state.sheet || { url:"", token:"" };
    state.pending = state.pending || [];
  }
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  function pad(n){ return (n<10?"0":"")+n; }
  function todayISO(){
    var d = new Date();
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function fmt(n){
    return n.toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function thaiDate(iso){
    return new Date(iso+"T00:00:00").toLocaleDateString("th-TH",
      {weekday:"long",day:"numeric",month:"long",year:"numeric"});
  }
  function num(id){ return parseFloat($(id).value); }

  function preview(){
    var km=num("km"), kmpl=num("kmpl"), price=num("price");
    var ok = km>=0 && kmpl>0 && price>=0;
    var liters = ok ? km/kmpl : 0;
    $("liters").textContent = fmt(liters)+" ลิตร";
    $("cost").textContent = fmt(ok ? liters*price : 0);
  }

  function render(){
    var t = todayISO(), ym = t.slice(0,7), today=0, month=0;
    var days = {};
    state.trips.forEach(function(x){
      if(x.date===t) today+=x.cost;
      if(x.date.slice(0,7)===ym) month+=x.cost;
      (days[x.date] = days[x.date] || []).push(x);
    });
    $("today").textContent = fmt(today);
    $("month").textContent = fmt(month);

    var log = $("log");
    log.textContent = "";
    var keys = Object.keys(days).sort().reverse();
    if(!keys.length){
      var e = document.createElement("p");
      e.className="empty";
      e.textContent="ยังไม่มีบันทึก กรอกระยะทางแล้วกด “บันทึกค่าน้ำมัน”";
      log.appendChild(e);
      return;
    }
    keys.forEach(function(k){
      var list = days[k], sum = 0;
      list.forEach(function(x){ sum+=x.cost; });
      var day = document.createElement("div"); day.className="day";
      var top = document.createElement("div"); top.className="day-top";
      var d = document.createElement("span"); d.className="d"; d.textContent=thaiDate(k);
      var s = document.createElement("span"); s.className="t"; s.textContent=fmt(sum)+" บาท";
      top.appendChild(d); top.appendChild(s); day.appendChild(top);

      list.slice().reverse().forEach(function(x){
        var row = document.createElement("div"); row.className="trip";
        var info = document.createElement("span");
        info.textContent = x.km+" กม."+(x.note?" · "+x.note:"");
        var right = document.createElement("span");
        var c = document.createElement("span"); c.className="c"; c.textContent=fmt(x.cost)+" บาท ";
        var b = document.createElement("button"); b.className="del"; b.type="button";
        b.textContent="ลบ"; b.setAttribute("aria-label","ลบรายการ "+x.km+" กม. วันที่ "+thaiDate(k));
        b.addEventListener("click", function(){
          if(confirm("ลบรายการนี้?")){
            state.trips = state.trips.filter(function(y){ return y.id!==x.id; });
            if(state.pending.indexOf(x.id)<0) state.pending.push(x.id);
            persist(); render(); sync();
          }
        });
        right.appendChild(c); right.appendChild(b);
        row.appendChild(info); row.appendChild(right);
        day.appendChild(row);
      });
      log.appendChild(day);
    });
  }

  function save(){
    var km=num("km"), kmpl=num("kmpl"), price=num("price"), date=$("date").value;
    var err=$("err"); err.textContent="";
    if(!date){ err.textContent="เลือกวันที่ก่อนบันทึก"; return; }
    if(!(km>0)){ err.textContent="กรอกระยะทางที่มากกว่า 0 กิโลเมตร"; $("km").focus(); return; }
    if(!(kmpl>0)){ err.textContent="กรอกอัตราสิ้นเปลืองที่มากกว่า 0 กม./ลิตร"; $("kmpl").focus(); return; }
    if(!(price>=0)){ err.textContent="กรอกราคาน้ำมันต่อลิตร"; $("price").focus(); return; }

    var cost = Math.round((km/kmpl)*price*100)/100;
    state.trips.push({
      id: Date.now()+"-"+Math.random().toString(36).slice(2,6),
      date: date, km: km, kmpl: kmpl, price: price,
      note: $("note").value.trim(), cost: cost, synced: false
    });
    state.settings = { kmpl:kmpl, price:price };
    persist();
    $("km").value=""; $("note").value="";
    preview(); render(); sync(); $("km").focus();
  }

  function exportCSV(){
    if(!state.trips.length){ $("err").textContent="ยังไม่มีข้อมูลให้ดาวน์โหลด"; return; }
    var rows = [["วันที่","ระยะทาง (กม.)","กม./ลิตร","ราคา (บาท/ลิตร)","ลิตร","ค่าน้ำมัน (บาท)","หมายเหตุ"]];
    state.trips.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; })
      .forEach(function(x){
        rows.push([x.date,x.km,x.kmpl,x.price,(x.km/x.kmpl).toFixed(2),x.cost.toFixed(2),x.note||""]);
      });
    var csv = rows.map(function(r){
      return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(",");
    }).join("\r\n");
    var blob = new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "fuel-log.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  }

  var syncing = false;
  function setStatus(t){ $("sheetStatus").textContent = t; }
  function api(params){
    var u = new URL(state.sheet.url);
    params.token = state.sheet.token;
    Object.keys(params).forEach(function(k){ u.searchParams.set(k, params[k]); });
    return fetch(u.toString()).then(function(r){ return r.json(); }).then(function(j){
      if(!j.ok) throw new Error(j.error || "เกิดข้อผิดพลาด");
      return j;
    });
  }
  function sync(){
    if(!state.sheet.url || syncing) return Promise.resolve();
    syncing = true; setStatus("กำลังซิงก์…");
    var chain = Promise.resolve();
    state.pending.slice().forEach(function(id){
      chain = chain.then(function(){ return api({action:"delete", id:id}); })
        .then(function(){ state.pending = state.pending.filter(function(p){ return p!==id; }); });
    });
    state.trips.filter(function(t){ return !t.synced; }).forEach(function(t){
      chain = chain.then(function(){
        return api({action:"add", id:t.id, date:t.date, km:t.km, kmpl:t.kmpl, price:t.price,
                    liters:(t.km/t.kmpl).toFixed(4), cost:t.cost, note:t.note||""});
      }).then(function(){ t.synced = true; });
    });
    return chain.then(function(){ return api({action:"list"}); }).then(function(res){
      var have = {};
      state.trips.forEach(function(t){ have[t.id] = t; });
      res.trips.forEach(function(r){
        if(have[r.id]) have[r.id].synced = true;
        else if(state.pending.indexOf(r.id) < 0){
          state.trips.push({ id:r.id, date:r.date, km:r.km, kmpl:r.kmpl, price:r.price,
                             note:r.note, cost:r.cost, synced:true });
        }
      });
      setStatus("ซิงก์แล้วเมื่อ " + new Date().toLocaleTimeString("th-TH"));
    }).catch(function(e){
      setStatus("ซิงก์ไม่สำเร็จ: " + e.message + " (ข้อมูลยังอยู่ในเครื่อง จะลองใหม่ครั้งต่อไป)");
    }).then(function(){ syncing = false; persist(); render(); });
  }

  load();
  $("sheetUrl").value = state.sheet.url;
  $("sheetToken").value = state.sheet.token;
  $("sheetSave").addEventListener("click", function(){
    state.sheet = { url: $("sheetUrl").value.trim(), token: $("sheetToken").value.trim() };
    persist();
    if(state.sheet.url) sync(); else setStatus("ยกเลิกการเชื่อมต่อแล้ว");
  });
  $("date").value = todayISO();
  $("kmpl").value = state.settings.kmpl;
  $("price").value = state.settings.price;
  ["km","kmpl","price"].forEach(function(id){ $(id).addEventListener("input", preview); });
  $("save").addEventListener("click", save);
  $("csv").addEventListener("click", exportCSV);
  preview(); render(); sync();
})();
</script>
</body>
</html>
