<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกค่าน้ำมันรายวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0ee; --card:#ffffff; --ink:#14302b; --muted:#5d7570; --line:#d3dcd9;
    --pump:#14302b; --digit:#ffb703; --danger:#b3261e;
    --font:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1b19; --card:#172826; --ink:#e6efec; --muted:#93aaa4; --line:#2b403c;
      --pump:#0a1312; --digit:#ffb703; --danger:#ff8a80; }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;
    padding:max(16px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
  main{max-width:560px;margin:0 auto;display:grid;gap:16px}
  h1{font-size:1.25rem;margin:4px 0 0;font-weight:600}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
  .who button{min-height:36px;padding:4px 12px;font-size:.9rem}

  .pump{background:var(--pump);border-radius:14px;padding:18px 20px;color:#cfe0db;
    border:2px solid #0a1312;box-shadow:inset 0 0 0 1px #2c4a44}
  .pump .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .pump small{display:block;font-size:.85rem;color:#9fb8b2}
  .pump .big{font-size:2.6rem;font-weight:700;color:var(--digit);font-variant-numeric:tabular-nums;line-height:1.1}
  .pump .mid{font-size:1.4rem;font-weight:600;color:var(--digit);font-variant-numeric:tabular-nums;text-align:right}
  .pump .unit{font-size:1rem;margin-left:4px;color:#cfe0db;font-weight:500}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:1rem;margin:0 0 12px;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .full{grid-column:1/-1}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
  input,select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
  input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--digit);outline-offset:1px}
  .preview{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);
    display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .preview b{font-size:1.4rem;font-variant-numeric:tabular-nums}
  .preview span{color:var(--muted);font-size:.9rem}
  button{font:inherit;cursor:pointer;min-height:44px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--ink);padding:8px 14px}
  button:disabled{opacity:.6;cursor:wait}
  button.primary{width:100%;margin-top:12px;background:var(--pump);color:var(--digit);
    border-color:var(--pump);font-weight:600;font-size:1.05rem}
  @media (prefers-color-scheme: dark){ button.primary{border-color:var(--digit)} }
  button.link{border:0;background:none;color:var(--ink);text-decoration:underline;min-height:36px;padding:4px 0}
  .err{color:var(--danger);font-size:.9rem;min-height:1.2em;margin:8px 0 0}
  .note{color:var(--muted);font-size:.85rem;margin:8px 0 0}

  .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
  .head h2{margin:0}
  .day{border-top:1px solid var(--line);padding:12px 0}
  .day:first-of-type{border-top:0}
  .day-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .day-top .d{font-weight:600}
  .day-top .t{font-weight:700;font-variant-numeric:tabular-nums}
  .trip{display:flex;justify-content:space-between;align-items:center;gap:8px;
    color:var(--muted);font-size:.9rem;padding:6px 0 0 12px}
  .trip .c{font-variant-numeric:tabular-nums;white-space:nowrap}
  .trip .del{min-height:32px;padding:0 10px;font-size:.85rem;color:var(--danger)}
  select{appearance:auto;background:var(--card)}
  .month-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
    text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 4px;min-height:56px}
  .month-row:first-of-type{border-top:0}
  .month-row[aria-pressed="true"]{background:var(--bg)}
  .month-row .m{font-weight:600}
  .month-row .s{display:block;color:var(--muted);font-size:.85rem}
  .month-row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cat-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line)}
  .cat-row:first-child{border-top:0}
  .cat-row .n{font-weight:600}
  .cat-row .s{display:block;color:var(--muted);font-size:.85rem}
  .cat-row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cat-row.total{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px}
  .cat-row.total .v{font-size:1.2rem}
  .filter{display:flex;gap:10px;align-items:center;margin:8px 0 4px}
  .filter select{flex:1}
  .sum{color:var(--muted);font-size:.9rem;margin:4px 0 8px}
  details.adm{border-top:1px solid var(--line);padding:8px 4px}
  details.adm:first-of-type{border-top:0}
  details.adm summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;min-height:40px;align-items:center}
  details.adm .u{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.9rem;padding:4px 0 4px 12px}
  .empty{color:var(--muted);text-align:center;padding:16px 0}
  .foot{color:var(--muted);font-size:.8rem;text-align:center;overflow-wrap:anywhere;margin:0}
</style>
</head>
<body>
<main>

  <!-- ===== หน้าล็อกอิน ===== -->
  <div id="authView" hidden style="display:grid;gap:16px">
    <h1>บันทึกค่าน้ำมันรายวัน</h1>
    <section class="card">
      <h2 id="authTitle">เข้าสู่ระบบ</h2>
      <form id="authForm" novalidate>
        <div class="grid">
          <div class="full">
            <label for="user">ชื่อผู้ใช้</label>
            <input id="user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
          </div>
          <div class="full">
            <label for="pass">รหัสผ่าน</label>
            <input id="pass" type="password" autocomplete="current-password">
          </div>
          <div class="full" id="inviteWrap" hidden>
            <label for="invite">รหัสเชิญ (ถ้าผู้ดูแลกำหนดไว้)</label>
            <input id="invite" autocomplete="off">
          </div>
        </div>
        <p class="err" id="authErr" role="alert"></p>
        <button class="primary" id="authBtn" type="submit">เข้าสู่ระบบ</button>
      </form>
      <p class="note">
        <span id="switchText">ยังไม่มีบัญชี?</span>
        <button class="link" id="switchBtn" type="button">สมัครสมาชิก</button>
      </p>
    </section>
  </div>

  <!-- ===== หน้าแอพ ===== -->
  <div id="appView" hidden style="display:grid;gap:16px">
    <div class="top">
      <h1>บันทึกค่าน้ำมันรายวัน</h1>
      <div class="who"><span id="whoName"></span><button id="logout" type="button">ออกจากระบบ</button></div>
    </div>

    <section class="pump" aria-live="polite">
      <div class="row">
        <div>
          <small>วันนี้</small>
          <div class="big"><span id="today">0.00</span><span class="unit">บาท</span></div>
        </div>
        <div>
          <small style="text-align:right">เดือนนี้</small>
          <div class="mid"><span id="month">0.00</span><span class="unit">บาท</span></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>เพิ่มการเดินทาง</h2>
      <div class="grid">
        <div class="full">
          <label for="date">วันที่</label>
          <input id="date" type="date">
        </div>
        <div class="full">
          <label for="km">ระยะทาง (กิโลเมตร)</label>
          <input id="km" type="number" inputmode="decimal" min="0" step="0.1" placeholder="เช่น 24">
        </div>
        <div>
          <label for="kmpl">อัตราสิ้นเปลือง (กม./ลิตร)</label>
          <input id="kmpl" type="number" inputmode="decimal" min="0.1" step="0.1">
        </div>
        <div>
          <label for="price">ราคาน้ำมัน (บาท/ลิตร)</label>
          <input id="price" type="number" inputmode="decimal" min="0" step="0.01">
        </div>
        <div class="full" id="catWrap" hidden>
          <label for="cat">หมวดหมู่</label>
          <select id="cat">
            <option value="work">ไปทำงาน</option>
            <option value="partner">ไปหาแฟน</option>
          </select>
        </div>
        <div class="full">
          <label for="note">หมายเหตุ (ไม่บังคับ)</label>
          <input id="note" type="text" maxlength="60" placeholder="เช่น บ้าน → โรงเรียน">
        </div>
      </div>
      <div class="preview">
        <span id="liters">0.00 ลิตร</span>
        <b><span id="cost">0.00</span> บาท</b>
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="primary" id="save" type="button">บันทึกค่าน้ำมัน</button>
    </section>

    <section class="card">
      <h2>สรุปรายเดือน</h2>
      <div id="months"></div>
    </section>

    <section class="card" id="catCard" hidden>
      <h2>ค่าน้ำมันแยกตามหมวดหมู่</h2>
      <p class="sum" id="catPeriod"></p>
      <div id="catLog"></div>
    </section>

    <section class="card" id="historyCard">
      <div class="head">
        <h2>ประวัติรายวัน</h2>
        <button id="csv" type="button">ดาวน์โหลด CSV</button>
      </div>
      <div class="filter">
        <label for="monthFilter" style="margin:0">เดือน</label>
        <select id="monthFilter"></select>
      </div>
      <p class="sum" id="rangeSum"></p>
      <div id="log"></div>
    </section>

    <section class="card" id="adminCard" hidden>
      <div class="head">
        <h2>ภาพรวมทุกคน (ผู้ดูแล)</h2>
        <span style="display:flex;gap:8px">
          <button id="adminRefresh" type="button">รีเฟรช</button>
          <button id="adminCsv" type="button">CSV</button>
        </span>
      </div>
      <p class="sum" id="adminMsg"></p>
      <div id="adminLog"></div>
    </section>

    <p class="foot" id="syncStatus" role="status"></p>
  </div>

</main>

<script>
(function(){
  // ผู้ดูแลแก้บรรทัดนี้ครั้งเดียว: วาง Web App URL (ลงท้ายด้วย /exec) จาก Google Apps Script
  var API_URL = "วาง_WEB_APP_URL_ที่นี่";

  var CATS = { work:"ไปทำงาน", partner:"ไปหาแฟน" };
  var SESSION_KEY = "fuel-session";
  var OLD_KEY = "fuel-tracker-v1";
  var $ = function(id){ return document.getElementById(id); };
  var session = null, data = null, mode = "login", syncing = false, filterMonth = "", adminData = null;

  /* ---------- helpers ---------- */
  function pad(n){ return (n<10?"0":"")+n; }
  function todayISO(){
    var d = new Date();
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function fmt(n){ return n.toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function thaiDate(iso){
    return new Date(iso+"T00:00:00").toLocaleDateString("th-TH",
      {weekday:"long",day:"numeric",month:"long",year:"numeric"});
  }
  function num(id){ return parseFloat($(id).value); }
  function configured(){ return /^https:\/\/script\.google\.com\//.test(API_URL); }

  /* ---------- local storage (แยกตามผู้ใช้) ---------- */
  function dataKey(u){ return "fuel-data:"+u; }
  function emptyData(){ return { settings:{kmpl:15, price:40}, trips:[], pending:[], admin:false }; }
  function loadData(u){
    try{
      var d = JSON.parse(localStorage.getItem(dataKey(u)));
      if(d && Array.isArray(d.trips)){
        return { settings:d.settings||{kmpl:15,price:40}, trips:d.trips, pending:d.pending||[], admin:!!d.admin };
      }
    }catch(e){}
    return emptyData();
  }
  function persist(){
    if(!session || !data) return;
    try{ localStorage.setItem(dataKey(session.username), JSON.stringify(data)); }catch(e){}
  }
  function saveSession(){
    try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){}
  }
  function migrateOld(){
    // ย้ายข้อมูลจากแอพเวอร์ชันเก่า (ที่ยังไม่มีล็อกอิน) เข้าบัญชีแรกที่ล็อกอิน
    try{
      var raw = localStorage.getItem(OLD_KEY);
      if(!raw || data.trips.length) return;
      var old = JSON.parse(raw);
      if(old && Array.isArray(old.trips)){
        data.trips = old.trips.map(function(t){
          return { id:t.id, date:t.date, km:t.km, kmpl:t.kmpl, price:t.price,
                   note:t.note||"", cost:t.cost, synced:false };
        });
        if(old.settings) data.settings = old.settings;
        localStorage.removeItem(OLD_KEY);
      }
    }catch(e){}
  }

  /* ---------- API ---------- */
  function call(action, body){
    if(!configured()){
      var ce = new Error("ผู้ดูแลยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html");
      ce.code = "config"; return Promise.reject(ce);
    }
    var payload = Object.assign({action:action}, body||{});
    return fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).then(function(j){
      if(!j.ok){ var e = new Error(j.error||"เกิดข้อผิดพลาด"); e.code = j.code; throw e; }
      return j;
    }, function(){
      var ne = new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่");
      ne.code = "network"; throw ne;
    });
  }

  /* ---------- views ---------- */
  function show(which){
    $("authView").hidden = which!=="auth";
    $("appView").hidden = which!=="app";
  }
  function setMode(m){
    mode = m;
    var reg = m==="register";
    $("authTitle").textContent = reg ? "สมัครสมาชิก" : "เข้าสู่ระบบ";
    $("authBtn").textContent = reg ? "สมัครสมาชิก" : "เข้าสู่ระบบ";
    $("switchText").textContent = reg ? "มีบัญชีแล้ว?" : "ยังไม่มีบัญชี?";
    $("switchBtn").textContent = reg ? "เข้าสู่ระบบ" : "สมัครสมาชิก";
    $("inviteWrap").hidden = !reg;
    $("pass").setAttribute("autocomplete", reg ? "new-password" : "current-password");
    $("authErr").textContent = "";
  }
  function showAuth(msg){
    show("auth"); setMode("login");
    $("authErr").textContent = msg || "";
    $("pass").value = "";
  }

  /* ---------- คำนวณ / แสดงผล ---------- */
  function preview(){
    var km=num("km"), kmpl=num("kmpl"), price=num("price");
    var ok = km>=0 && kmpl>0 && price>=0;
    var liters = ok ? km/kmpl : 0;
    $("liters").textContent = fmt(liters)+" ลิตร";
    $("cost").textContent = fmt(ok ? liters*price : 0);
  }

  function fmtKm(n){ return n.toLocaleString("th-TH",{maximumFractionDigits:1}); }
  function monthLabel(m){
    return new Date(m+"-01T00:00:00").toLocaleDateString("th-TH",{month:"long",year:"numeric"});
  }
  function renderMonths(stats){
    var keys = Object.keys(stats).sort().reverse();
    var sel = $("monthFilter");
    sel.textContent = "";
    var all = document.createElement("option"); all.value = ""; all.textContent = "ทุกเดือน"; sel.appendChild(all);
    keys.forEach(function(m){
      var o = document.createElement("option"); o.value = m; o.textContent = monthLabel(m); sel.appendChild(o);
    });
    sel.value = filterMonth;

    var box = $("months");
    box.textContent = "";
    if(!keys.length){
      var e = document.createElement("p"); e.className = "empty";
      e.textContent = "ยังไม่มีข้อมูลรายเดือน";
      box.appendChild(e); return;
    }
    keys.forEach(function(m){
      var st = stats[m];
      var b = document.createElement("button"); b.type = "button"; b.className = "month-row";
      b.setAttribute("aria-pressed", filterMonth===m ? "true" : "false");
      var left = document.createElement("span");
      var name = document.createElement("span"); name.className = "m"; name.textContent = monthLabel(m);
      var sub = document.createElement("span"); sub.className = "s";
      sub.textContent = fmtKm(st.km)+" กม. · "+st.n+" เที่ยว"+(st.km>0 ? " · เฉลี่ย "+fmt(st.cost/st.km)+" บาท/กม." : "");
      left.appendChild(name); left.appendChild(sub);
      if(data.admin && st.cats && (st.cats.work || st.cats.partner)){
        var parts = [];
        if(st.cats.work) parts.push("ไปทำงาน "+fmt(st.cats.work));
        if(st.cats.partner) parts.push("ไปหาแฟน "+fmt(st.cats.partner));
        if(st.cats[""]) parts.push("ไม่ระบุ "+fmt(st.cats[""]));
        var cs = document.createElement("span"); cs.className = "s"; cs.textContent = parts.join(" · ");
        left.appendChild(cs);
      }
      var v = document.createElement("span"); v.className = "v"; v.textContent = fmt(st.cost)+" บาท";
      b.appendChild(left); b.appendChild(v);
      b.addEventListener("click", function(){
        filterMonth = (filterMonth===m) ? "" : m;
        render();
        if(filterMonth) $("historyCard").scrollIntoView({behavior:"smooth", block:"start"});
      });
      box.appendChild(b);
    });
  }

  function renderCats(pc, total){
    var card = $("catCard");
    card.hidden = !(data && data.admin);
    if(card.hidden) return;
    $("catPeriod").textContent = filterMonth ? monthLabel(filterMonth) : "ทุกเดือน";
    var box = $("catLog"); box.textContent = "";
    if(!total){
      var e = document.createElement("p"); e.className = "empty"; e.textContent = "ยังไม่มีข้อมูลในช่วงนี้";
      box.appendChild(e); return;
    }
    var sumKm = 0, sumN = 0;
    ["work","partner",""].forEach(function(k){
      var v = pc[k]; if(!v) return;
      sumKm += v.km; sumN += v.n;
      var row = document.createElement("div"); row.className = "cat-row";
      var left = document.createElement("span");
      var n = document.createElement("span"); n.className = "n";
      n.textContent = k ? "ค่าน้ำมัน"+CATS[k] : "ไม่ระบุหมวดหมู่";
      var sub = document.createElement("span"); sub.className = "s";
      sub.textContent = fmtKm(v.km)+" กม. · "+v.n+" เที่ยว · "+Math.round(v.cost/total*100)+"%";
      left.appendChild(n); left.appendChild(sub);
      var val = document.createElement("span"); val.className = "v"; val.textContent = fmt(v.cost)+" บาท";
      row.appendChild(left); row.appendChild(val); box.appendChild(row);
    });
    var tr = document.createElement("div"); tr.className = "cat-row total";
    var tl = document.createElement("span");
    var tn = document.createElement("span"); tn.className = "n"; tn.textContent = "รวมทุกหมวดหมู่";
    var ts = document.createElement("span"); ts.className = "s"; ts.textContent = fmtKm(sumKm)+" กม. · "+sumN+" เที่ยว";
    tl.appendChild(tn); tl.appendChild(ts);
    var tv = document.createElement("span"); tv.className = "v"; tv.textContent = fmt(total)+" บาท";
    tr.appendChild(tl); tr.appendChild(tv); box.appendChild(tr);
  }

  function render(){
    if(!data) return;
    if(filterMonth && !data.trips.some(function(x){ return x.date.slice(0,7)===filterMonth; })) filterMonth = "";
    var t = todayISO(), ym = t.slice(0,7), today=0, month=0, days = {}, stats = {}, rc=0, rk=0, rn=0, pc = {};
    data.trips.forEach(function(x){
      var m = x.date.slice(0,7);
      if(x.date===t) today+=x.cost;
      if(m===ym) month+=x.cost;
      var st = stats[m] = stats[m] || {cost:0, km:0, n:0};
      st.cost += x.cost; st.km += x.km; st.n++;
      var ck = CATS[x.cat] ? x.cat : "";
      st.cats = st.cats || {}; st.cats[ck] = (st.cats[ck] || 0) + x.cost;
      if(!filterMonth || m===filterMonth){
        (days[x.date] = days[x.date] || []).push(x);
        rc += x.cost; rk += x.km; rn++;
        var p = pc[ck] = pc[ck] || {cost:0, km:0, n:0};
        p.cost += x.cost; p.km += x.km; p.n++;
      }
    });
    $("today").textContent = fmt(today);
    $("month").textContent = fmt(month);
    $("catWrap").hidden = !data.admin;
    renderMonths(stats);
    renderCats(pc, rc);
    $("rangeSum").textContent = rn ? ((filterMonth ? monthLabel(filterMonth) : "ทุกเดือน")+" รวม "+fmt(rc)+" บาท · "+fmtKm(rk)+" กม. · "+rn+" เที่ยว") : "";

    var log = $("log");
    log.textContent = "";
    var keys = Object.keys(days).sort().reverse();
    if(!keys.length){
      var e = document.createElement("p");
      e.className="empty";
      e.textContent="ยังไม่มีบันทึก กรอกระยะทางแล้วกด “บันทึกค่าน้ำมัน”";
      log.appendChild(e);
      return;
    }
    keys.forEach(function(k){
      var list = days[k], sum = 0;
      list.forEach(function(x){ sum+=x.cost; });
      var day = document.createElement("div"); day.className="day";
      var top = document.createElement("div"); top.className="day-top";
      var d = document.createElement("span"); d.className="d"; d.textContent=thaiDate(k);
      var s = document.createElement("span"); s.className="t"; s.textContent=fmt(sum)+" บาท";
      top.appendChild(d); top.appendChild(s); day.appendChild(top);

      list.slice().reverse().forEach(function(x){
        var row = document.createElement("div"); row.className="trip";
        var info = document.createElement("span");
        info.textContent = x.km+" กม."+(CATS[x.cat]?" · "+CATS[x.cat]:"")+(x.note?" · "+x.note:"");
        var right = document.createElement("span");
        var c = document.createElement("span"); c.className="c"; c.textContent=fmt(x.cost)+" บาท ";
        var b = document.createElement("button"); b.className="del"; b.type="button";
        b.textContent="ลบ"; b.setAttribute("aria-label","ลบรายการ "+x.km+" กม. วันที่ "+thaiDate(k));
        b.addEventListener("click", function(){
          if(confirm("ลบรายการนี้?")){
            data.trips = data.trips.filter(function(y){ return y.id!==x.id; });
            if(data.pending.indexOf(x.id)<0) data.pending.push(x.id);
            persist(); render(); sync();
          }
        });
        right.appendChild(c); right.appendChild(b);
        row.appendChild(info); row.appendChild(right);
        day.appendChild(row);
      });
      log.appendChild(day);
    });
  }

  function save(){
    var km=num("km"), kmpl=num("kmpl"), price=num("price"), date=$("date").value;
    var err=$("err"); err.textContent="";
    if(!date){ err.textContent="เลือกวันที่ก่อนบันทึก"; return; }
    if(!(km>0)){ err.textContent="กรอกระยะทางที่มากกว่า 0 กิโลเมตร"; $("km").focus(); return; }
    if(!(kmpl>0)){ err.textContent="กรอกอัตราสิ้นเปลืองที่มากกว่า 0 กม./ลิตร"; $("kmpl").focus(); return; }
    if(!(price>=0)){ err.textContent="กรอกราคาน้ำมันต่อลิตร"; $("price").focus(); return; }

    var cost = Math.round((km/kmpl)*price*100)/100;
    data.trips.push({
      id: Date.now()+"-"+Math.random().toString(36).slice(2,6),
      date: date, km: km, kmpl: kmpl, price: price,
      note: $("note").value.trim(), cost: cost, synced: false,
      cat: data.admin ? $("cat").value : ""
    });
    data.settings = { kmpl:kmpl, price:price, cat: data.admin ? $("cat").value : (data.settings.cat || "work") };
    persist();
    $("km").value=""; $("note").value="";
    preview(); render(); sync(); $("km").focus();
  }

  function downloadCSV(rows, name){
    var csv = rows.map(function(r){
      return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(",");
    }).join("\r\n");
    var blob = new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  }
  function exportCSV(){
    if(!data.trips.length){ $("err").textContent="ยังไม่มีข้อมูลให้ดาวน์โหลด"; return; }
    var adm = !!data.admin;
    var head = ["วันที่","ระยะทาง (กม.)","กม./ลิตร","ราคา (บาท/ลิตร)","ลิตร","ค่าน้ำมัน (บาท)","หมายเหตุ"];
    if(adm) head.push("หมวดหมู่");
    var rows = [head];
    data.trips.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; })
      .forEach(function(x){
        var r = [x.date,x.km,x.kmpl,x.price,(x.km/x.kmpl).toFixed(2),x.cost.toFixed(2),x.note||""];
        if(adm) r.push(CATS[x.cat]||"");
        rows.push(r);
      });
    downloadCSV(rows, "fuel-log.csv");
  }

  /* ---------- ภาพรวมทุกคน (ผู้ดูแล) ---------- */
  function renderAdmin(){
    var box = $("adminLog"); box.textContent = "";
    if(!adminData || !adminData.length){
      var e = document.createElement("p"); e.className = "empty"; e.textContent = "ยังไม่มีข้อมูล";
      box.appendChild(e); return;
    }
    adminData.forEach(function(mm){
      var d = document.createElement("details"); d.className = "adm";
      var sm = document.createElement("summary");
      var l = document.createElement("span");
      l.textContent = monthLabel(mm.month)+" · "+fmtKm(mm.km)+" กม. · "+mm.users.length+" คน";
      var r = document.createElement("b"); r.textContent = fmt(mm.cost)+" บาท";
      sm.appendChild(l); sm.appendChild(r); d.appendChild(sm);
      mm.users.forEach(function(u){
        var row = document.createElement("div"); row.className = "u";
        var a = document.createElement("span"); a.textContent = u.username+" · "+fmtKm(u.km)+" กม. · "+u.trips+" เที่ยว";
        var b = document.createElement("span"); b.textContent = fmt(u.cost)+" บาท";
        row.appendChild(a); row.appendChild(b); d.appendChild(row);
      });
      box.appendChild(d);
    });
  }
  function loadAdmin(){
    if(!session || !data || !data.admin){ $("adminCard").hidden = true; return Promise.resolve(); }
    $("adminCard").hidden = false;
    $("adminMsg").textContent = "กำลังโหลด…";
    return call("adminSummary",{token:session.token}).then(function(res){
      adminData = res.months; $("adminMsg").textContent = ""; renderAdmin();
    }).catch(function(e){ $("adminMsg").textContent = e.message; });
  }
  function exportAdminCSV(){
    if(!adminData || !adminData.length) return;
    var rows = [["เดือน","ผู้ใช้","ระยะทาง (กม.)","ค่าน้ำมัน (บาท)","จำนวนเที่ยว"]];
    adminData.slice().reverse().forEach(function(mm){
      mm.users.forEach(function(u){ rows.push([mm.month,u.username,u.km.toFixed(1),u.cost.toFixed(2),u.trips]); });
    });
    downloadCSV(rows, "fuel-all-users-by-month.csv");
  }

  /* ---------- ซิงก์กับ Google Sheet ---------- */
  function setStatus(t){ $("syncStatus").textContent = t; }

  function expireSession(){
    persist();
    session = null; data = null;
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
    showAuth("เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง (ข้อมูลที่ยังไม่ซิงก์ยังอยู่ในเครื่อง)");
  }

  function sync(){
    if(!session || !data || syncing || !configured()) return Promise.resolve();
    syncing = true; setStatus("กำลังซิงก์…");
    var tok = session.token, p = Promise.resolve();

    if(data.pending.length){
      var ids = data.pending.slice();
      p = p.then(function(){ return call("delete",{token:tok, ids:ids}); })
           .then(function(){ data.pending = data.pending.filter(function(x){ return ids.indexOf(x)<0; }); });
    }
    var unsynced = data.trips.filter(function(t){ return !t.synced; });
    for(var i=0;i<unsynced.length;i+=100){
      (function(chunk){
        p = p.then(function(){
          return call("add",{token:tok, trips:chunk.map(function(t){
            return {id:t.id, date:t.date, km:t.km, kmpl:t.kmpl, price:t.price, note:t.note||"", category:t.cat||""};
          })});
        }).then(function(){ chunk.forEach(function(t){ t.synced = true; }); });
      })(unsynced.slice(i,i+100));
    }

    return p.then(function(){ return call("list",{token:tok}); }).then(function(res){
      data.admin = !!res.admin;
      var remote = {};
      res.trips.forEach(function(r){ remote[r.id] = r; });
      // ลบรายการที่เคยซิงก์แล้วแต่หายไปจากชีต (ถูกลบจากเครื่องอื่น)
      data.trips = data.trips.filter(function(t){ return !t.synced || remote[t.id]; });
      var have = {};
      data.trips.forEach(function(t){ have[t.id] = true; });
      res.trips.forEach(function(r){
        if(!have[r.id] && data.pending.indexOf(r.id)<0){
          data.trips.push({id:r.id, date:r.date, km:r.km, kmpl:r.kmpl, price:r.price,
                           note:r.note, cost:r.cost, synced:true, cat:r.category||""});
        }
      });
      setStatus("ซิงก์แล้วเมื่อ "+new Date().toLocaleTimeString("th-TH"));
    }).catch(function(e){
      if(e.code==="auth"){ syncing=false; expireSession(); return; }
      setStatus("ซิงก์ไม่สำเร็จ: "+e.message+" (ข้อมูลยังอยู่ในเครื่อง จะลองใหม่ครั้งต่อไป)");
    }).then(function(){
      syncing = false; persist(); render();
      if(session && data) loadAdmin();
    });
  }

  /* ---------- เข้า/ออกจากระบบ ---------- */
  function enterApp(){
    data = loadData(session.username);
    filterMonth = ""; adminData = null;
    $("adminCard").hidden = !data.admin;
    migrateOld();
    persist();
    $("whoName").textContent = session.username;
    $("date").value = todayISO();
    $("kmpl").value = data.settings.kmpl;
    $("price").value = data.settings.price;
    $("cat").value = data.settings.cat || "work";
    $("km").value = ""; $("note").value = ""; $("err").textContent = "";
    setStatus("");
    show("app");
    preview(); render(); sync();
  }

  function submitAuth(ev){
    ev.preventDefault();
    var u = $("user").value.trim().toLowerCase(), pw = $("pass").value;
    var err = $("authErr"); err.textContent = "";
    if(!u || !pw){ err.textContent = "กรอกชื่อผู้ใช้และรหัสผ่าน"; return; }
    var body = { username:u, password:pw };
    if(mode==="register") body.invite = $("invite").value.trim();
    $("authBtn").disabled = true;
    call(mode, body).then(function(res){
      session = { username:res.username, token:res.token };
      saveSession();
      $("pass").value = ""; $("invite").value = "";
      enterApp();
    }).catch(function(e){
      err.textContent = e.message;
    }).then(function(){ $("authBtn").disabled = false; });
  }

  function logout(){
    sync().then(function(){
      var dirty = data && (data.pending.length || data.trips.some(function(t){ return !t.synced; }));
      if(dirty && !confirm("มีข้อมูลที่ยังไม่ได้ซิงก์ ถ้าออกจากระบบตอนนี้ข้อมูลนั้นจะหายไป ต้องการออกจากระบบหรือไม่?")) return;
      try{
        localStorage.removeItem(dataKey(session.username)); // ล้างข้อมูลในเครื่อง เผื่อใช้เครื่องร่วมกัน
        localStorage.removeItem(SESSION_KEY);
      }catch(e){}
      session = null; data = null; adminData = null; filterMonth = "";
      $("adminCard").hidden = true; $("catCard").hidden = true; $("catWrap").hidden = true;
      $("user").value = "";
      showAuth("");
    });
  }

  /* ---------- เริ่มต้น ---------- */
  ["km","kmpl","price"].forEach(function(id){ $(id).addEventListener("input", preview); });
  $("save").addEventListener("click", save);
  $("csv").addEventListener("click", exportCSV);
  $("monthFilter").addEventListener("change", function(){ filterMonth = this.value; render(); });
  $("adminRefresh").addEventListener("click", loadAdmin);
  $("adminCsv").addEventListener("click", exportAdminCSV);
  $("authForm").addEventListener("submit", submitAuth);
  $("switchBtn").addEventListener("click", function(){ setMode(mode==="login" ? "register" : "login"); });
  $("logout").addEventListener("click", logout);

  try{ session = JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ session = null; }
  if(session && session.username && session.token) enterApp();
  else { session = null; showAuth(configured() ? "" : "ผู้ดูแลยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html"); }
})();
</script>
